name: Deploy to Hetzner VPS

on:
  push:
    branches:
      - main
    # Trigger on any meaningful changes (removed path filters for reliability)

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          envs: OPENROUTER_API_KEY
          script: |
            set -e  # Exit on error

            echo "🚀 Starting deployment..."

            # Navigate to project directory
            cd ~/root/aidashboard || { echo "❌ Project directory not found"; exit 1; }

            # Pull latest changes
            echo "📥 Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            # Sync the OpenRouter key into the VPS .env (idempotent upsert).
            # The key is provided by the OPENROUTER_API_KEY GitHub Actions secret;
            # it lives only in the untracked .env, which git reset does not touch.
            if [ -n "$OPENROUTER_API_KEY" ]; then
              echo "🔑 Setting OPENROUTER_API_KEY in .env..."
              touch .env
              if grep -q '^OPENROUTER_API_KEY=' .env; then
                sed -i "s|^OPENROUTER_API_KEY=.*|OPENROUTER_API_KEY=${OPENROUTER_API_KEY}|" .env
              else
                echo "OPENROUTER_API_KEY=${OPENROUTER_API_KEY}" >> .env
              fi
            else
              echo "⚠️  OPENROUTER_API_KEY secret not set; trend analysis will be skipped."
            fi

            # Stop and remove all containers to avoid stale state
            echo "🛑 Stopping existing containers..."
            docker compose -f docker-compose.prod.yml down || true

            # Rebuild and restart all services
            echo "🔨 Building and restarting all services..."
            docker compose -f docker-compose.prod.yml up -d --build

            # Wait for services to be ready
            echo "⏳ Waiting for services to start..."
            sleep 10

            # Check if all critical containers are running
            if docker compose -f docker-compose.prod.yml ps | grep -E "(postgres|electric|web)" | grep -v "Up" > /dev/null; then
              echo "❌ Deployment failed - some services not running"
              docker compose -f docker-compose.prod.yml ps
              docker compose -f docker-compose.prod.yml logs --tail=50
              exit 1
            else
              echo "✅ Deployment successful!"
              docker compose -f docker-compose.prod.yml ps
            fi

            # Clean up old images
            echo "🧹 Cleaning up old images..."
            docker image prune -af --filter "until=24h"

            echo "🎉 Deployment complete!"

      - name: Notify on failure
        if: failure()
        run: echo "❌ Deployment failed! Check the logs above."
